# Egress filter for sandbox sessions. Sandboxes sit on an internal Docker network with no route
# out; this proxy is their only exit, and it refuses anything that isn't public web traffic.
http_port 3128

acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl to_private dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl to_private dst ::1 fc00::/7 fe80::/10
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny to_private
http_access allow all

# No caching, no identifying headers, modest limits.
cache deny all
via off
forwarded_for delete
request_header_max_size 64 KB
reply_body_max_size 100 MB
connect_timeout 15 seconds

# Logs go to the image's default /var/log/squid (squid runs as the 'proxy' user and can't open /dev/stdout).
access_log daemon:/var/log/squid/access.log
